name: Surface Xubuntu Autoinstall ISO

on:
  push:
    branches:
      - surface-xubuntu-build

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out build branch
        uses: actions/checkout@v5

      - name: Free runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h /

      - name: Install ISO tools
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xorriso python3-yaml

      - name: Download validated Surface live ISO v5
        uses: actions/download-artifact@v4
        with:
          name: xubuntu-24.04.4-surface-pro-4-ready-to-flash-v5
          path: base-artifact
          github-token: ${{ github.token }}
          repository: BoomForge/nanos
          run-id: 33384979529

      - name: Verify validated base ISO
        shell: bash
        run: |
          cd base-artifact
          sha256sum -c xubuntu-24.04.4-surface-pro-4-amd64.iso.sha256
          grep -q 'scripts/casper' xubuntu-24.04.4-surface-pro-4-amd64.iso.initrd-report.txt
          grep -q 'lib/modules/6.19.8-surface-3/' xubuntu-24.04.4-surface-pro-4-amd64.iso.initrd-report.txt

      - name: Add bootloader autoinstall mode
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE="$GITHUB_WORKSPACE/base-artifact/xubuntu-24.04.4-surface-pro-4-amd64.iso"
          OUT="$GITHUB_WORKSPACE/xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso"
          WORK="$RUNNER_TEMP/surface-autoinstall-patch"
          PATCH="$WORK/patch"
          VERIFY="$WORK/verify"

          rm -rf "$WORK" "$OUT"
          mkdir -p "$PATCH/boot/grub" "$VERIFY"

          # Only patch the already-validated v5 image. The Surface kernel,
          # casper initrd, IPTS stack and live USB fixes remain unchanged.
          xorriso -osirrox on -indev "$BASE" \
            -extract /boot/grub/grub.cfg "$PATCH/boot/grub/grub.cfg" \
            -extract /md5sum.txt "$WORK/md5sum.txt" >/dev/null 2>&1

          cat > "$PATCH/autoinstall.yaml" <<'AUTOINSTALL'
          autoinstall:
            version: 1
            interactive-sections: []
            refresh-installer:
              update: false
            locale: en_AU.UTF-8
            keyboard:
              layout: us
              variant: ""
            timezone: Australia/Hobart
            source:
              id: xubuntu-desktop
              search_drivers: false
            apt:
              geoip: false
              fallback: offline-install
            identity:
              realname: Surface User
              hostname: surface-pro4
              username: surface
              password: "$6$SurfaceTemp$naVbdsS6fDapK4OAKJJhcg6QrKFEQNjNgZrB2K5aqKfSe10mfbOqjWU17HEPJaaA8kyU5vXBjalE1IDOYaM991"
            storage:
              layout:
                name: direct
                match:
                  size: largest
            ssh:
              install-server: false
            drivers:
              install: false
            oem:
              install: false
            shutdown: reboot
            late-commands:
              - curtin in-target --target=/target -- dpkg-query -W linux-image-surface iptsd libwacom-surface onboard lightdm
              - curtin in-target --target=/target -- update-grub
              - curtin in-target --target=/target -- mkdir -p /etc/lightdm/lightdm.conf.d /etc/onboard /home/surface/.config/autostart
              - |
                cat > /target/etc/lightdm/lightdm.conf.d/50-surface-autologin.conf <<'EOF'
                [Seat:*]
                autologin-user=surface
                autologin-user-timeout=0
                user-session=xubuntu
                EOF
              - |
                cat > /target/etc/onboard/onboard-defaults.conf <<'EOF'
                [keyboard]
                input-event-source=GTK
                touch-input=none
                EOF
              - |
                cat > /target/home/surface/.config/autostart/onboard.desktop <<'EOF'
                [Desktop Entry]
                Type=Application
                Name=Onboard On-Screen Keyboard
                Comment=Automatically start the touch keyboard
                Exec=onboard
                Terminal=false
                X-GNOME-Autostart-enabled=true
                X-XFCE-Autostart-Override=true
                EOF
              - |
                cat > /target/home/surface/Desktop/Restart-Onboard.desktop <<'EOF'
                [Desktop Entry]
                Type=Application
                Name=Restart On-Screen Keyboard
                Comment=Restart Onboard if it was closed
                Exec=sh -c 'pkill onboard || true; sleep 1; onboard'
                Icon=input-keyboard
                Terminal=false
                EOF
              - curtin in-target --target=/target -- chown -R surface:surface /home/surface/.config /home/surface/Desktop
              - curtin in-target --target=/target -- chmod +x /home/surface/Desktop/Restart-Onboard.desktop
          AUTOINSTALL

          # Keep normal Xubuntu boot entries intact. The destructive option is
          # deliberately appended and is never made the default.
          cat >> "$PATCH/boot/grub/grub.cfg" <<'GRUB'

          menuentry 'INSTALL SURFACE PRO 4 - ERASE INTERNAL DRIVE' {
              set gfxpayload=keep
              linux /casper/vmlinuz boot=casper autoinstall ignore_uuid console=tty1 ---
              initrd /casper/initrd
          }
          GRUB

          # Refresh md5 entries for the two changed/added files without
          # touching the casper SHA256SUMS (no casper payload changed here).
          cp "$WORK/md5sum.txt" "$PATCH/md5sum.txt"
          sed -i '\#  \./boot/grub/grub.cfg$#d; \#  \./autoinstall.yaml$#d' "$PATCH/md5sum.txt"
          (
            cd "$PATCH"
            md5sum ./boot/grub/grub.cfg ./autoinstall.yaml
          ) >> "$PATCH/md5sum.txt"

          python3 - <<'PY'
          import yaml
          from pathlib import Path
          p = Path("${{ runner.temp }}/surface-autoinstall-patch/patch/autoinstall.yaml")
          data = yaml.safe_load(p.read_text())
          a = data["autoinstall"]
          assert a["version"] == 1
          assert a["source"]["id"] == "xubuntu-desktop"
          assert a["storage"]["layout"]["name"] == "direct"
          assert a["storage"]["layout"]["match"]["size"] == "largest"
          assert a["identity"]["username"] == "surface"
          late = "\n".join(str(x) for x in a["late-commands"])
          assert "autologin-user=surface" in late
          assert "input-event-source=GTK" in late
          assert "Exec=onboard" in late
          PY

          grep -q "INSTALL SURFACE PRO 4 - ERASE INTERNAL DRIVE" "$PATCH/boot/grub/grub.cfg"
          grep -q "autoinstall ignore_uuid" "$PATCH/boot/grub/grub.cfg"
          grep -q "autologin-user=surface" "$PATCH/autoinstall.yaml"
          grep -q "input-event-source=GTK" "$PATCH/autoinstall.yaml"

          xorriso -indev "$BASE" -outdev "$OUT" \
            -update_r "$PATCH" / \
            -boot_image any replay -commit >/dev/null

          # Verify the actual finished ISO, not only the patch files.
          xorriso -osirrox on -indev "$OUT" \
            -extract /autoinstall.yaml "$VERIFY/autoinstall.yaml" \
            -extract /boot/grub/grub.cfg "$VERIFY/grub.cfg" >/dev/null 2>&1
          grep -q '^autoinstall:' "$VERIFY/autoinstall.yaml"
          grep -q "INSTALL SURFACE PRO 4 - ERASE INTERNAL DRIVE" "$VERIFY/grub.cfg"
          grep -q "autoinstall ignore_uuid" "$VERIFY/grub.cfg"
          grep -q "autologin-user=surface" "$VERIFY/autoinstall.yaml"
          grep -q "input-event-source=GTK" "$VERIFY/autoinstall.yaml"
          grep -q "Exec=onboard" "$VERIFY/autoinstall.yaml"

          xorriso -indev "$OUT" -report_el_torito plain | tee "$OUT.boot-report.txt"
          grep -q 'UEFI' "$OUT.boot-report.txt"
          grep -q 'BIOS' "$OUT.boot-report.txt"
          sha256sum "$OUT" | tee "$OUT.sha256"

          cp "$PATCH/autoinstall.yaml" "$GITHUB_WORKSPACE/xubuntu-24.04.4-surface-pro-4-autoinstall.yaml"
          cp "$GITHUB_WORKSPACE/base-artifact/xubuntu-24.04.4-surface-pro-4-amd64.iso.initrd-report.txt" \
             "$GITHUB_WORKSPACE/xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso.initrd-report.txt"

          echo
          echo 'AUTOINSTALL SAFETY/ACCESSIBILITY:'
          echo '  - Normal live boot remains available.'
          echo '  - Autoinstall is an explicit GRUB menu choice, not the default.'
          echo '  - It erases the largest non-install-media disk using the direct layout.'
          echo '  - Desktop auto-login is enabled for user surface.'
          echo '  - Onboard launches automatically after login.'
          echo '  - Onboard defaults to GTK event input to avoid the Noble XInput crash.'
          echo '  - Password for sudo/manual login remains: surface'
          ls -lh "$OUT"

      - name: Upload Surface autoinstall ISO
        uses: actions/upload-artifact@v4
        with:
          name: xubuntu-24.04.4-surface-pro-4-AUTOINSTALL-v2
          path: |
            xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso
            xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso.sha256
            xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso.boot-report.txt
            xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso.initrd-report.txt
            xubuntu-24.04.4-surface-pro-4-autoinstall.yaml
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
