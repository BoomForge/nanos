name: Surface Xubuntu Autoinstall ISO

on:
  push:
    branches:
      - surface-xubuntu-build

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out build branch
        uses: actions/checkout@v5

      - name: Free runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h /

      - name: Install ISO tools
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xorriso python3-yaml

      - name: Download validated Surface live ISO v5
        uses: actions/download-artifact@v4
        with:
          name: xubuntu-24.04.4-surface-pro-4-ready-to-flash-v5
          path: base-artifact
          github-token: ${{ github.token }}
          repository: BoomForge/nanos
          run-id: 33384979529

      - name: Verify validated base ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          cd base-artifact
          ISO=xubuntu-24.04.4-surface-pro-4-amd64.iso
          EXPECTED="$(awk 'NR==1 {print $1}' "$ISO.sha256")"
          ACTUAL="$(sha256sum "$ISO" | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          grep -q 'scripts/casper' "$ISO.initrd-report.txt"
          grep -q 'lib/modules/6.19.8-surface-3/' "$ISO.initrd-report.txt"

      - name: Build zero-input Surface autoinstall ISO
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE="$GITHUB_WORKSPACE/base-artifact/xubuntu-24.04.4-surface-pro-4-amd64.iso"
          OUT="$GITHUB_WORKSPACE/xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso"
          WORK="$RUNNER_TEMP/surface-autoinstall-v5"
          PATCH="$WORK/patch"
          VERIFY="$WORK/verify"

          rm -rf "$WORK" "$OUT"
          mkdir -p "$PATCH/boot/grub" "$VERIFY"

          echo 'Extracting only the two small files that need editing...'
          xorriso -osirrox on -indev "$BASE" -extract /boot/grub/grub.cfg "$PATCH/boot/grub/grub.cfg"
          xorriso -osirrox on -indev "$BASE" -extract /md5sum.txt "$PATCH/md5sum.txt"

          cat > "$PATCH/autoinstall.yaml" <<'AUTOINSTALL'
          autoinstall:
            version: 1
            interactive-sections: []
            refresh-installer:
              update: false
            locale: en_AU.UTF-8
            keyboard:
              layout: us
              variant: ""
            timezone: Australia/Hobart
            source:
              search_drivers: false
            apt:
              geoip: false
              fallback: offline-install
            identity:
              realname: Surface User
              hostname: surface-pro4
              username: surface
              password: "$6$SurfaceTemp$naVbdsS6fDapK4OAKJJhcg6QrKFEQNjNgZrB2K5aqKfSe10mfbOqjWU17HEPJaaA8kyU5vXBjalE1IDOYaM991"
            storage:
              layout:
                name: direct
                match:
                  size: largest
            ssh:
              install-server: false
            drivers:
              install: false
            oem:
              install: false
            shutdown: reboot
            late-commands:
              - curtin in-target --target=/target -- dpkg-query -W linux-image-surface iptsd libwacom-surface onboard lightdm
              - curtin in-target --target=/target -- update-grub
              - curtin in-target --target=/target -- mkdir -p /etc/lightdm/lightdm.conf.d /etc/onboard /usr/local/bin /home/surface/.config/autostart /home/surface/Desktop
              - |
                cat > /target/etc/lightdm/lightdm.conf.d/50-surface-autologin.conf <<'EOF'
                [Seat:*]
                autologin-user=surface
                autologin-user-timeout=0
                user-session=xubuntu
                EOF
              - |
                cat > /target/etc/onboard/onboard-defaults.conf <<'EOF'
                [keyboard]
                input-event-source=GTK
                touch-input=none
                EOF
              - |
                cat > /target/usr/local/bin/surface-onboard <<'EOF'
                #!/bin/sh
                gsettings set org.onboard.keyboard input-event-source 'GTK' || true
                gsettings set org.onboard.keyboard touch-input 'none' || true
                exec onboard
                EOF
              - |
                cat > /target/home/surface/.config/autostart/onboard.desktop <<'EOF'
                [Desktop Entry]
                Type=Application
                Name=Onboard On-Screen Keyboard
                Comment=Automatically start the touch keyboard
                Exec=/usr/local/bin/surface-onboard
                Terminal=false
                X-GNOME-Autostart-enabled=true
                X-XFCE-Autostart-Override=true
                EOF
              - |
                cat > /target/home/surface/Desktop/Restart-Onboard.desktop <<'EOF'
                [Desktop Entry]
                Type=Application
                Name=Restart On-Screen Keyboard
                Comment=Restart Onboard if it was closed
                Exec=sh -c 'pkill onboard || true; sleep 1; /usr/local/bin/surface-onboard'
                Icon=input-keyboard
                Terminal=false
                EOF
              - curtin in-target --target=/target -- chmod +x /usr/local/bin/surface-onboard /home/surface/Desktop/Restart-Onboard.desktop
              - curtin in-target --target=/target -- chown -R surface:surface /home/surface/.config /home/surface/Desktop
          AUTOINSTALL

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("${{ runner.temp }}/surface-autoinstall-v5/patch/boot/grub/grub.cfg")
          s = p.read_text()
          s = re.sub(r'(?m)^\s*set\s+(?:default|timeout|timeout_style)=.*\n?', '', s)
          entry = r'''set default=0
          set timeout_style=menu
          set timeout=5

          menuentry 'INSTALL SURFACE PRO 4 - ERASE INTERNAL DRIVE (AUTO IN 5 SECONDS)' {
              set gfxpayload=keep
              linux /casper/vmlinuz boot=casper autoinstall ignore_uuid console=tty1 ---
              initrd /casper/initrd
          }

          '''
          p.write_text(entry + s)
          PY

          sed -i '\#  \./boot/grub/grub.cfg$#d; \#  \./autoinstall.yaml$#d' "$PATCH/md5sum.txt"
          (
            cd "$PATCH"
            md5sum ./boot/grub/grub.cfg ./autoinstall.yaml
          ) >> "$PATCH/md5sum.txt"

          echo 'Validating autoinstall and GRUB configuration...'
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          root = Path("${{ runner.temp }}/surface-autoinstall-v5/patch")
          a = yaml.safe_load((root / 'autoinstall.yaml').read_text())['autoinstall']
          assert a['version'] == 1
          assert a['identity']['username'] == 'surface'
          assert a['storage']['layout']['name'] == 'direct'
          assert a['storage']['layout']['match']['size'] == 'largest'
          assert 'id' not in a['source']
          late = '\n'.join(str(x) for x in a['late-commands'])
          assert 'autologin-user=surface' in late
          assert 'surface-onboard' in late
          s = (root / 'boot/grub/grub.cfg').read_text()
          first = s.find('menuentry ')
          assert first >= 0
          assert s[first:].startswith("menuentry 'INSTALL SURFACE PRO 4")
          assert 'set default=0' in s[:first]
          assert 'set timeout=5' in s[:first]
          assert 'autoinstall ignore_uuid' in s[first:first+500]
          PY

          echo 'Patching ONLY grub.cfg, autoinstall.yaml and md5sum.txt into validated v5...'
          xorriso -indev "$BASE" -outdev "$OUT" \
            -overwrite nondir \
            -map "$PATCH/boot/grub/grub.cfg" /boot/grub/grub.cfg \
            -map "$PATCH/autoinstall.yaml" /autoinstall.yaml \
            -map "$PATCH/md5sum.txt" /md5sum.txt \
            -boot_image any replay -commit

          echo 'Validating the finished ISO...'
          xorriso -osirrox on -indev "$OUT" -extract /boot/grub/grub.cfg "$VERIFY/grub.cfg"
          xorriso -osirrox on -indev "$OUT" -extract /autoinstall.yaml "$VERIFY/autoinstall.yaml"
          xorriso -osirrox on -indev "$BASE" -extract /casper/vmlinuz "$VERIFY/base-vmlinuz"
          xorriso -osirrox on -indev "$OUT" -extract /casper/vmlinuz "$VERIFY/out-vmlinuz"
          xorriso -osirrox on -indev "$BASE" -extract /casper/initrd "$VERIFY/base-initrd"
          xorriso -osirrox on -indev "$OUT" -extract /casper/initrd "$VERIFY/out-initrd"
          cmp "$VERIFY/base-vmlinuz" "$VERIFY/out-vmlinuz"
          cmp "$VERIFY/base-initrd" "$VERIFY/out-initrd"

          python3 - <<'PY'
          import yaml
          from pathlib import Path
          v = Path("${{ runner.temp }}/surface-autoinstall-v5/verify")
          a = yaml.safe_load((v / 'autoinstall.yaml').read_text())['autoinstall']
          assert a['identity']['username'] == 'surface'
          assert a['storage']['layout']['match']['size'] == 'largest'
          s = (v / 'grub.cfg').read_text()
          first = s.find('menuentry ')
          assert first >= 0
          assert s[first:].startswith("menuentry 'INSTALL SURFACE PRO 4")
          assert 'set default=0' in s[:first]
          assert 'set timeout=5' in s[:first]
          assert 'autoinstall ignore_uuid' in s[first:first+500]
          PY

          xorriso -indev "$OUT" -report_el_torito plain | tee "$OUT.boot-report.txt"
          grep -q 'UEFI' "$OUT.boot-report.txt"
          grep -q 'BIOS' "$OUT.boot-report.txt"
          sha256sum "$OUT" | tee "$OUT.sha256"

          cp "$PATCH/autoinstall.yaml" "$GITHUB_WORKSPACE/xubuntu-24.04.4-surface-pro-4-autoinstall.yaml"
          cp "$GITHUB_WORKSPACE/base-artifact/xubuntu-24.04.4-surface-pro-4-amd64.iso.initrd-report.txt" \
             "$GITHUB_WORKSPACE/xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso.initrd-report.txt"

          echo
          echo 'SURFACE AUTOBOOT INSTALL V5 READY:'
          echo '  - Base Surface kernel/initrd verified unchanged.'
          echo '  - INSTALL SURFACE PRO 4 is GRUB entry 0.'
          echo '  - Automatic start after 5 seconds with no input.'
          echo '  - Largest non-install-media disk is erased and used.'
          echo '  - Desktop auto-login is enabled for surface.'
          echo '  - Onboard starts automatically through the GTK wrapper.'
          echo '  - Password for sudo/manual login: surface'
          ls -lh "$OUT"

      - name: Upload Surface autoinstall ISO
        uses: actions/upload-artifact@v4
        with:
          name: xubuntu-24.04.4-surface-pro-4-AUTOINSTALL-v5
          path: |
            xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso
            xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso.sha256
            xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso.boot-report.txt
            xubuntu-24.04.4-surface-pro-4-autoinstall-amd64.iso.initrd-report.txt
            xubuntu-24.04.4-surface-pro-4-autoinstall.yaml
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
