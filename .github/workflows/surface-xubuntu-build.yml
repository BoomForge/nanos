name: Surface Xubuntu Direct Install ISO

on:
  push:
    branches:
      - surface-xubuntu-build

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out build branch
        uses: actions/checkout@v5

      - name: Prepare direct-installer build
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x surface-build/build-surface-xubuntu.sh
          chmod +x surface-build/inject-direct-installer.sh

          # Inject the direct-install layer BEFORE the builder calculates
          # manifests and repacks the live squashfs. This keeps the proven
          # Surface/casper build path and removes Subiquity from installation.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('surface-build/build-surface-xubuntu.sh')
          s = p.read_text()

          # Ensure all disk/UEFI tools used by the text installer exist both
          # in the live environment and in the copied target system.
          old = '  bluez libinput-tools xinput blueman onboard\n'
          new = ('  bluez libinput-tools xinput blueman onboard \\\n'
                 '  parted dosfstools grub-efi-amd64-bin grub-efi-amd64-signed shim-signed efibootmgr\n')
          if old not in s:
              raise SystemExit('Surface package install block changed unexpectedly')
          s = s.replace(old, new, 1)

          marker = 'log "Updating live manifests"\n'
          injection = '''log "Injecting zero-input direct Surface installer"\n"$GITHUB_WORKSPACE/surface-build/inject-direct-installer.sh" \\\n  "$LIVE" "$ISO" "$STD_MERGED" "$FULL_MERGED"\n\n'''
          if marker not in s:
              raise SystemExit('Live-manifest marker not found')
          s = s.replace(marker, injection + marker, 1)

          # The stock builder updates casper SHA256SUMS. Also regenerate the
          # media MD5 list because GRUB and the live squashfs are now changed.
          marker2 = 'rm -f "$ISO/casper/SHA256SUMS.gpg"\n'
          extra = '''rm -f "$ISO/casper/SHA256SUMS.gpg"\n\nlog "Refreshing whole-media MD5 list"\n(\n  cd "$ISO"\n  find . -type f ! -name md5sum.txt ! -name boot.catalog -print0 \\\n    | sort -z | xargs -0 md5sum > md5sum.txt\n)\n'''
          if marker2 not in s:
              raise SystemExit('Casper checksum marker not found')
          s = s.replace(marker2, extra, 1)

          p.write_text(s)
          PY

          bash -n surface-build/build-surface-xubuntu.sh
          bash -n surface-build/inject-direct-installer.sh

      - name: Free runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h /

      - name: Build Surface direct-install ISO
        shell: bash
        run: |
          set +e
          ./surface-build/build-surface-xubuntu.sh
          rc=$?
          set -e

          ISO=xubuntu-24.04.4-surface-pro-4-amd64.iso
          SHA="$ISO.sha256"
          BOOT="$ISO.boot-report.txt"
          INITRD="$ISO.initrd-report.txt"

          if (( rc != 0 )); then
            # Older versions of the builder could return 32 from harmless
            # final unmount cleanup after BUILD_COMPLETE. Accept that one
            # code only when every expected output already exists.
            if (( rc == 32 )) && [[ -s "$ISO" && -s "$SHA" && -s "$BOOT" && -s "$INITRD" ]]; then
              echo 'Builder returned cleanup rc=32 after producing all outputs; continuing to hard validation.'
            else
              echo "Builder failed with rc=$rc"
              exit "$rc"
            fi
          fi

      - name: Validate direct installer inside finished ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO=xubuntu-24.04.4-surface-pro-4-amd64.iso
          SHA="$ISO.sha256"
          BOOT="$ISO.boot-report.txt"
          INITRD="$ISO.initrd-report.txt"
          VERIFY="$RUNNER_TEMP/direct-install-verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"

          EXPECTED="$(awk 'NR==1 {print $1}' "$SHA")"
          ACTUAL="$(sha256sum "$ISO" | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

          grep -q 'scripts/casper' "$INITRD"
          grep -Eq 'lib/modules/[^/]*-surface[^/]*/' "$INITRD"
          grep -q 'UEFI' "$BOOT"
          grep -q 'BIOS' "$BOOT"

          xorriso -osirrox on -indev "$ISO" \
            -extract /boot/grub/grub.cfg "$VERIFY/grub.cfg" \
            -extract /casper/minimal.standard.live.squashfs "$VERIFY/live.squashfs" \
            -extract /casper/minimal.standard.manifest "$VERIFY/standard.manifest" >/dev/null 2>&1

          first="$(grep -n -m1 '^menuentry ' "$VERIFY/grub.cfg" | cut -d: -f1)"
          test -n "$first"
          sed -n "${first}p" "$VERIFY/grub.cfg" | grep -q 'INSTALL SURFACE PRO 4'
          grep -q '^set default=0$' "$VERIFY/grub.cfg"
          grep -q '^set timeout=5$' "$VERIFY/grub.cfg"
          grep -q 'surface_direct_install=1' "$VERIFY/grub.cfg"
          grep -q 'systemd.unit=multi-user.target' "$VERIFY/grub.cfg"

          grep -q '^linux-image-surface ' "$VERIFY/standard.manifest"
          grep -q '^iptsd ' "$VERIFY/standard.manifest"
          grep -q '^libwacom-surface ' "$VERIFY/standard.manifest"
          grep -q '^onboard ' "$VERIFY/standard.manifest"

          unsquashfs -cat "$VERIFY/live.squashfs" usr/local/sbin/surface-direct-install > "$VERIFY/installer.sh"
          unsquashfs -cat "$VERIFY/live.squashfs" etc/systemd/system/surface-direct-install.service > "$VERIFY/installer.service"
          bash -n "$VERIFY/installer.sh"
          grep -q 'parted -s.*mklabel gpt' "$VERIFY/installer.sh"
          grep -q 'minimal.standard.squashfs' "$VERIFY/installer.sh"
          grep -q 'grub-install --target=x86_64-efi' "$VERIFY/installer.sh"
          grep -q 'autologin-user=surface' "$VERIFY/installer.sh"
          grep -q 'surface-onboard' "$VERIFY/installer.sh"
          grep -q 'systemctl poweroff' "$VERIFY/installer.sh"
          grep -q 'ConditionKernelCommandLine=surface_direct_install' "$VERIFY/installer.service"

          echo 'DIRECT INSTALL ISO VALIDATION PASSED'
          echo "SHA256=$ACTUAL"

      - name: Upload Surface direct-install ISO
        uses: actions/upload-artifact@v4
        with:
          name: xubuntu-24.04.4-surface-pro-4-DIRECT-INSTALL-v1
          path: |
            xubuntu-24.04.4-surface-pro-4-amd64.iso
            xubuntu-24.04.4-surface-pro-4-amd64.iso.sha256
            xubuntu-24.04.4-surface-pro-4-amd64.iso.boot-report.txt
            xubuntu-24.04.4-surface-pro-4-amd64.iso.initrd-report.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
