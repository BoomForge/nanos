name: Surface Xubuntu ISO build

on:
  push:
    branches:
      - surface-xubuntu-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          echo "After cleanup:"
          df -h /

      - name: Patch remaster for casper live-media UUID compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('surface-build/build-surface-xubuntu.sh')
          s = p.read_text()

          marker = 'log "Rebuilding bootable BIOS/UEFI ISO"'
          inject = r'''log "Allowing remastered casper initrd to accept the live USB medium"
          for cfg in "$ISO/boot/grub/grub.cfg" "$ISO/boot/grub/loopback.cfg"; do
            [[ -f "$cfg" ]] || continue
            sed -i -E 's/(boot=casper)([[:space:]])/\1 ignore_uuid\2/g' "$cfg"
          done
          grep -Rqs 'boot=casper ignore_uuid' "$ISO/boot/grub" \
            || die "Failed to add ignore_uuid to casper boot arguments"

          '''
          if marker not in s:
              raise SystemExit('Could not find ISO rebuild marker in remaster script')
          s = s.replace(marker, inject + marker, 1)
          s = s.replace(' -update_r "$ISO" / -boot_image any replay -volid XUBUNTU_SURFACE -commit >/dev/null',
                        ' -update_r "$ISO" / -boot_image any replay -commit >/dev/null')
          p.write_text(s)
          PY

      - name: Build and validate Surface Pro 4 Xubuntu ISO
        shell: bash
        env:
          SURFACE_BUILD_WORKDIR: ${{ runner.temp }}/surface-xubuntu-work
        run: |
          chmod +x surface-build/build-surface-xubuntu.sh
          set +e
          ./surface-build/build-surface-xubuntu.sh
          rc=$?
          set -e

          ISO=xubuntu-24.04.4-surface-pro-4-amd64.iso
          SHA="$ISO.sha256"
          BOOT="$ISO.boot-report.txt"
          INITRD="$ISO.initrd-report.txt"

          if [[ $rc -ne 0 ]]; then
            if [[ $rc -eq 32 && -s "$ISO" && -s "$SHA" && -s "$BOOT" && -s "$INITRD" ]]; then
              echo "Ignoring harmless post-build cleanup exit code 32."
            else
              echo "Build failed with exit code $rc"
              exit "$rc"
            fi
          fi

          grep -q 'scripts/casper' "$INITRD"
          grep -q 'lib/modules/6.19.8-surface-3/' "$INITRD"
          grep -q 'UEFI' "$BOOT"
          grep -q 'BIOS' "$BOOT"
          sha256sum -c "$SHA"
          ls -lh "$ISO"
          df -h /

      - name: Upload ready-to-flash ISO
        uses: actions/upload-artifact@v4
        with:
          name: xubuntu-24.04.4-surface-pro-4-ready-to-flash-v3
          path: |
            xubuntu-24.04.4-surface-pro-4-amd64.iso
            xubuntu-24.04.4-surface-pro-4-amd64.iso.sha256
            xubuntu-24.04.4-surface-pro-4-amd64.iso.boot-report.txt
            xubuntu-24.04.4-surface-pro-4-amd64.iso.initrd-report.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
