name: Surface Xubuntu ISO build

on:
  push:
    branches:
      - surface-xubuntu-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          echo "After cleanup:"
          df -h /

      - name: Patch remaster for robust Surface live USB boot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('surface-build/build-surface-xubuntu.sh')
          s = p.read_text()

          # Force the drivers required to see a DD-written live USB on the
          # Surface Pro 4 into the Surface-kernel initrd. This avoids relying
          # on the GitHub runner's detected hardware when mkinitramfs decides
          # which modules to include.
          initrd_marker = 'log "Building a Surface-kernel initrd WITH Ubuntu casper"'
          initrd_inject = r'''log "Forcing Surface live-USB storage/filesystem drivers into initrd"
          sudo tee -a "$FULL_MERGED/etc/initramfs-tools/modules" >/dev/null <<'MODULES'
          xhci_pci
          xhci_hcd
          usb_storage
          uas
          sd_mod
          squashfs
          loop
          isofs
          MODULES

          '''
          if initrd_marker not in s:
              raise SystemExit('Could not find initrd build marker in remaster script')
          s = s.replace(initrd_marker, initrd_inject + initrd_marker, 1)

          # Validate the critical live-media modules before the ISO is built.
          validation_marker = 'log "Adding Surface diagnostics to the live desktop"'
          validation_inject = r'''log "Validating critical live-USB modules in Surface initrd"
          INITRD_LIST="$WORKDIR/surface-initrd-files.txt"
          lsinitramfs "$LIVE_INITRD" > "$INITRD_LIST"
          for mod in xhci-pci usb-storage uas.ko squashfs.ko loop.ko isofs.ko; do
            grep -q "$mod" "$INITRD_LIST" || die "Surface initrd missing required live-USB module: $mod"
          done

          '''
          if validation_marker not in s:
              raise SystemExit('Could not find initrd validation marker in remaster script')
          s = s.replace(validation_marker, validation_inject + validation_marker, 1)

          # The remastered initrd does not share the stock image's embedded
          # casper UUID. Add ignore_uuid to every GRUB linux/vmlinuz line,
          # regardless of the exact argument layout used by Xubuntu 24.04.4.
          rebuild_marker = 'log "Rebuilding bootable BIOS/UEFI ISO"'
          grub_inject = r'''log "Allowing remastered casper initrd to accept the live USB medium"
          for cfg in "$ISO/boot/grub/grub.cfg" "$ISO/boot/grub/loopback.cfg"; do
            [[ -f "$cfg" ]] || continue
            tmp="${cfg}.surface"
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^[[:space:]]*linux ]] && [[ "$line" == *vmlinuz* ]] && [[ "$line" != *ignore_uuid* ]]; then
                if [[ "$line" == *" ---"* ]]; then
                  line="${line/ ---/ ignore_uuid ---}"
                else
                  line="$line ignore_uuid"
                fi
              fi
              printf '%s\n' "$line"
            done < "$cfg" > "$tmp"
            mv "$tmp" "$cfg"
          done
          grep -RqsE '^[[:space:]]*linux.*vmlinuz.*ignore_uuid' "$ISO/boot/grub" \
            || die "Failed to add ignore_uuid to GRUB live boot lines"

          '''
          if rebuild_marker not in s:
              raise SystemExit('Could not find ISO rebuild marker in remaster script')
          s = s.replace(rebuild_marker, grub_inject + rebuild_marker, 1)

          # Preserve the stock Xubuntu ISO volume ID because casper uses live
          # media identity during discovery. The first custom builds changed it.
          s = s.replace(' -update_r "$ISO" / -boot_image any replay -volid XUBUNTU_SURFACE -commit >/dev/null',
                        ' -update_r "$ISO" / -boot_image any replay -commit >/dev/null')
          p.write_text(s)
          PY

      - name: Build and validate Surface Pro 4 Xubuntu ISO
        shell: bash
        env:
          SURFACE_BUILD_WORKDIR: ${{ runner.temp }}/surface-xubuntu-work
        run: |
          chmod +x surface-build/build-surface-xubuntu.sh
          set +e
          ./surface-build/build-surface-xubuntu.sh
          rc=$?
          set -e

          ISO=xubuntu-24.04.4-surface-pro-4-amd64.iso
          SHA="$ISO.sha256"
          BOOT="$ISO.boot-report.txt"
          INITRD="$ISO.initrd-report.txt"

          if [[ $rc -ne 0 ]]; then
            if [[ $rc -eq 32 && -s "$ISO" && -s "$SHA" && -s "$BOOT" && -s "$INITRD" ]]; then
              echo "Ignoring harmless post-build cleanup exit code 32."
            else
              echo "Build failed with exit code $rc"
              exit "$rc"
            fi
          fi

          grep -q 'scripts/casper' "$INITRD"
          grep -q 'lib/modules/6.19.8-surface-3/' "$INITRD"
          grep -q 'UEFI' "$BOOT"
          grep -q 'BIOS' "$BOOT"
          sha256sum -c "$SHA"
          ls -lh "$ISO"
          df -h /

      - name: Upload ready-to-flash ISO
        uses: actions/upload-artifact@v4
        with:
          name: xubuntu-24.04.4-surface-pro-4-ready-to-flash-v4
          path: |
            xubuntu-24.04.4-surface-pro-4-amd64.iso
            xubuntu-24.04.4-surface-pro-4-amd64.iso.sha256
            xubuntu-24.04.4-surface-pro-4-amd64.iso.boot-report.txt
            xubuntu-24.04.4-surface-pro-4-amd64.iso.initrd-report.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
